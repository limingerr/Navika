<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender – NAVIKA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/kalender.css">
</head>

<body>
  <div class="app">

    <header class="kepala">
      <a href="dashboard.html" class="ikon-tombol" aria-label="Kembali ke dashboard">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </a>
      <h1 class="judul-kepala">Kalender</h1>
      <a href="pencarian.html" class="ikon-tombol" aria-label="Cari">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.8-3.8"/>
        </svg>
      </a>
    </header>

    <main>

      <!-- Grid kalender bulanan -->
      <section class="kartu-kalender" aria-labelledby="bulan-kalender">
        <nav class="nav-bulan" aria-label="Navigasi bulan">
          <button class="ikon-bulan" id="btn-prev" aria-label="Bulan sebelumnya">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m15 5-7 7 7 7"/>
            </svg>
          </button>
          <h2 class="judul-bulan" id="bulan-kalender" aria-live="polite">Oktober, 2026</h2>
          <button class="ikon-bulan" id="btn-next" aria-label="Bulan berikutnya">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m9 5 7 7-7 7"/>
            </svg>
          </button>
        </nav>

        <table class="grid-kalender" role="grid" aria-labelledby="bulan-kalender">
          <thead>
            <tr>
              <th scope="col" abbr="Minggu">Min</th>
              <th scope="col" abbr="Senin">Sen</th>
              <th scope="col" abbr="Selasa">Sel</th>
              <th scope="col" abbr="Rabu">Rab</th>
              <th scope="col" abbr="Kamis">Kam</th>
              <th scope="col" abbr="Jumat">Jum</th>
              <th scope="col" abbr="Sabtu">Sab</th>
            </tr>
          </thead>
          <tbody id="badan-kalender">
            <!-- diisi script/kalender.js -->
          </tbody>
        </table>
      </section>

      <!-- Chip filter kategori -->
      <nav class="chip-baris" aria-label="Filter agenda">
        <a href="#" class="chip chip-semua chip-aktif" aria-current="true">Semua</a>
        <a href="#" class="chip chip-beasiswa">Beasiswa</a>
        <a href="#" class="chip chip-magang">Magang</a>
        <a href="#" class="chip chip-bootcamp">Bootcamp</a>
        <a href="#" class="chip chip-deadline">Deadline</a>
      </nav>

      <!-- Agenda tanggal terpilih -->
      <section class="bagian-agenda" aria-labelledby="judul-agenda">
        <h2 class="judul-agenda" id="judul-agenda">Agenda Hari Ini</h2>
        <div id="isi-agenda" aria-live="polite">
          <!-- diisi script/kalender.js — kartu di-scroll horizontal -->
        </div>
      </section>

    </main>

    <nav class="nav-bawah" aria-label="Navigasi utama">
      <a class="nav-item" href="dashboard.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m4 10.5 8-6.8 8 6.8"/>
          <path d="M6 9.5V19a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V9.5"/>
          <path d="M10.5 20v-4.5h3V20"/>
        </svg>
        Home
      </a>
      <a class="nav-item" href="lihatSemua.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.8-3.8"/>
        </svg>
        Peluang
      </a>
      <a class="nav-item" href="bookmark.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 4.5h10a1 1 0 0 1 1 1V20l-6-4-6 4V5.5a1 1 0 0 1 1-1Z"/>
        </svg>
        Tersimpan
      </a>
      <a class="nav-item" href="profile.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="3.6"/>
          <path d="M5.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/>
        </svg>
        Profil
      </a>
    </nav>

  </div>

  <script src="script/agenda-data.js"></script>
  <script src="script/kalender.js"></script>
</body>

</html>
