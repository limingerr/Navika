<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Navika</title>
</head>
<body>
  <main>
    <section aria-labelledby="login-title">
      <header>
        <div aria-label="Logo Navika">
          <span>NAVIKA</span>
        </div>
      </header>

      <img src="asset/asset-ilustrasi-masuk.png" alt="Ilustrasi masuk ke akun Navika" width="300" height="220">

      <div>
        <h1 id="login-title">Temukan peluang yang sesuai untukmu</h1>
        <p>Masuk untuk melanjutkan ke akunmu.</p>
      </div>

      <form action="dashboard.html" method="get">
        <fieldset>
          <div>
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" placeholder="nama@email.com" autocomplete="email" required>
          </div>

          <div>
            <label for="login-password">Kata Sandi</label>
            <input id="login-password" name="password" type="password" placeholder="Masukkan kata sandi" autocomplete="current-password" required>
          </div>

          <div>
            <label for="remember-me">
              <input id="remember-me" name="remember" type="checkbox">
              Ingat saya
            </label>
            <a href="register.html">Lupa kata sandi?</a>
          </div>

          <button type="submit">Masuk</button>
        </fieldset>
      </form>

      <p>atau</p>
      <p>
        <a href="login.html">
          <img src="asset/google.png" alt="" width="18" height="18">
          Sign In with Google
        </a>
      </p>
      <p>Belum punya akun? <a href="register.html">Daftar</a></p>
    </section>
  </main>
</body>
</html>
