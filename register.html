<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi - Navika</title>
</head>
<body>
  <main>
    <section aria-labelledby="register-title">
      <header>
        <a href="index.html" aria-label="Navika - Beranda">
          <span>NAVIKA</span>
        </a>
      </header>

      <img
        src="asset/asset-ilustrasi-daftar.png"
        alt="Ilustrasi membuat akun Navika"
        width="300"
        height="220"
      >

      <div>
        <h1 id="register-title">Buat akun Navika</h1>
        <p>Gratis, hanya butuh satu menit.</p>
      </div>

      <form action="verifikasi.html" method="get">
        <fieldset>
          <legend>Informasi pendaftaran</legend>

          <div>
            <label for="register-name">Nama Lengkap</label>
            <input
              id="register-name"
              name="nama"
              type="text"
              placeholder="Nama lengkap Anda"
              autocomplete="name"
              required
            >
          </div>

          <div>
            <label for="register-email">Email</label>
            <input
              id="register-email"
              name="email"
              type="email"
              placeholder="nama@email.com"
              autocomplete="email"
              required
            >
          </div>

          <div>
            <label for="register-password">Kata Sandi</label>
            <input
              id="register-password"
              name="password"
              type="password"
              placeholder="Minimal 8 Karakter"
              minlength="8"
              autocomplete="new-password"
              required
            >
          </div>

          <div>
            <label for="confirm-password">Konfirmasi Kata Sandi</label>
            <input
              id="confirm-password"
              name="confirmPassword"
              type="password"
              placeholder="Minimal 8 Karakter"
              minlength="8"
              autocomplete="new-password"
              required
            >
          </div>

          <div>
            <input
              id="agree"
              name="agree"
              type="checkbox"
              required
            >
            <label for="agree">
              Saya setuju dengan Syarat &amp; Ketentuan serta Kebijakan Privasi Navika.
            </label>
          </div>

          <button type="submit">Daftar</button>
        </fieldset>
      </form>

      <p>atau</p>

      <p>
        <button type="button">
          <img
            src="asset/google.png"
            alt=""
            width="18"
            height="18"
          >
          Sign Up with Google
        </button>
      </p>

      <p>Sudah Punya Akun? <a href="login.html">Masuk</a></p>
    </section>
  </main>
</body>
</html>
