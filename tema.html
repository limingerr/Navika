<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubah Tema - Navika</title>
</head>
<body>

    <header>
        <nav>
            <a href="pengaturan.html">
                <img src="./asset/back-profile.svg" alt="Kembali">
                Kembali
            </a>
        </nav>
        <h1>Tampilan</h1>
        <p>Pilih mode warna aplikasi</p>
    </header>

    <main>
        <section>
            <h2>MODE WARNA</h2>
            <form action="#" method="get">
                <fieldset>
                    <legend>Pilihan Mode Warna</legend>
                    
                    <p>
                        <label>
                            <input type="radio" name="tema" value="terang" checked>
                            <img src="./asset/terang-tema.svg" alt="">
                            <strong>Terang</strong><br>
                            <span>Selalu menggunakan tema terang</span>
                        </label>
                    </p>

                    <p>
                        <label>
                            <input type="radio" name="tema" value="gelap">
                            <img src="./asset/gelap-tema.svg" alt="">
                            <strong>Gelap</strong><br>
                            <span>Selalu menggunakan tema gelap</span>
                        </label>
                    </p>

                    <p>
                        <label>
                            <input type="radio" name="tema" value="sistem">
                            <img src="./asset/ikutsistem-tema.svg" alt="">
                            <strong>Ikut Sistem</strong><br>
                            <span>Menyesuaikan pengaturan perangkat</span>
                        </label>
                    </p>
                </fieldset>
            </form>
        </section>

        <section>
            <h2>PRATINJAU MODE GELAP</h2>
            <img src="./asset/pratinjaumodegelap.svg" alt="Pratinjau kartu komponen Beasiswa KIP Kuliah dalam mode gelap">
            <p>Begini tampilan komponen saat mode gelap aktif.</p>

            <p>
                <img src="./asset/bohlam.svg" alt="">
                Mode gelap lebih nyaman di malam hari dan menghemat baterai pada layar OLED.
            </p>
        </section>
    </main>

</body>
</html>
